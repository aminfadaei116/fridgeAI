[project]
name = "fridge-agent"
version = "0.1.0"
description = "A multi-agent fridge that watches what you put in, tracks what is about to spoil, and cooks around it."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.60,<4",
    # Video input: Gemini's OpenAI-compatible surface takes text and images only.
    "google-genai>=1.0",
    "python-multipart>=0.0.12",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
fridge = "backend.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["backend*", "data*"]
