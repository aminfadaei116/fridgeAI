name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python 3.12

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Format
        run: .venv/bin/ruff format --check .

      # The suite needs no API key and no network: every agent is exercised on its
      # offline path, and the model plumbing runs against a stub client.
      - name: Test
        run: .venv/bin/python -m pytest -q
