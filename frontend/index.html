<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fridge Agent</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧊</text></svg>" />
</head>
<body>

<main class="frame">

  <header class="head">
    <div class="head-left">
      <h1>Fridge Agent</h1>
      <p class="mono head-scan" id="head-scan">no scans yet</p>
    </div>
    <div class="head-right">
      <p class="mono head-profile" id="head-profile"></p>
      <div class="door-pill" id="door-pill" data-state="closed">
        <span class="door-dot" aria-hidden="true"></span>
        <span id="door-label">Door closed</span>
      </div>
    </div>
  </header>

  <section class="scan-banner" id="scan-banner" hidden aria-live="polite">
    <span class="sweep" aria-hidden="true"></span>
    <div class="scan-copy">
      <p class="scan-title" id="scan-title">Door open</p>
      <p class="scan-sub" id="scan-sub">Comparing frames</p>
    </div>
    <div class="scan-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </section>

  <section class="stat-band" aria-label="Headline numbers">
    <div class="stat">
      <p class="stat-num" id="stat-today">0</p>
      <p class="stat-cap" id="stat-today-cap">items tracked</p>
    </div>
    <div class="stat">
      <p class="stat-num is-saved" id="stat-saved">$0.00</p>
      <p class="stat-cap" id="stat-saved-cap">saved in 7 days</p>
    </div>
    <div class="stat">
      <p class="stat-num is-wasted" id="stat-wasted">$0.00</p>
      <p class="stat-cap" id="stat-wasted-cap">wasted in 7 days</p>
    </div>
  </section>

  <div class="body">

    <div class="col-main">
      <div id="confirm-zone" aria-live="polite"></div>

      <div class="section-head">
        <h2>Eat these next</h2>
        <p class="mono section-count" id="items-count"></p>
      </div>
      <div id="items"></div>

      <div class="section-head" id="recipes-head" hidden>
        <h2>Cooks with what spoils today</h2>
        <p class="mono section-count" id="recipes-count"></p>
      </div>
      <div id="recipes"></div>
    </div>

    <aside class="col-side">
      <section class="block">
        <p class="mono block-label">waste ledger · 7 days</p>
        <div id="ledger"></div>
      </section>

      <section class="block">
        <p class="mono block-label">activity</p>
        <div id="activity"></div>
      </section>

      <section class="block">
        <p class="mono block-label">ask the fridge</p>
        <div class="chat-card">
          <div class="chat-log" id="chat-log" aria-live="polite"></div>
          <div class="chat-chips" id="chat-chips">
            <button class="ghost-chip" data-say="What's going off first?">What's going off first?</button>
            <button class="ghost-chip" data-say="Four guests tonight, vegetarian. What can I make?">4 guests, vegetarian</button>
            <button class="ghost-chip" data-say="How much have I wasted this week?">Waste report</button>
          </div>
          <form class="chat-input" id="composer">
            <input id="chat-text" type="text" autocomplete="off" placeholder="Ask about what's inside…" />
            <button type="button" class="mic" id="btn-mic" aria-label="Speak to the fridge">
              <span aria-hidden="true">●</span>
            </button>
            <button type="submit" class="send" id="btn-send">Ask</button>
          </form>
          <p class="chat-hint mono" id="chat-hint"></p>
        </div>
      </section>

      <section class="block">
        <p class="mono block-label">seven agents</p>
        <div id="roster"></div>
      </section>

      <section class="block">
        <p class="mono block-label">controls</p>
        <div class="controls">
          <button class="ghost-chip" id="btn-camera">Start camera</button>
          <label class="ghost-chip" for="sim-input">Simulate a door cycle</label>
          <input type="file" id="sim-input" accept="image/*" multiple hidden />
          <button class="ghost-chip" id="btn-digest">Today's briefing</button>
          <button class="ghost-chip" id="btn-seed">Reset demo fridge</button>
        </div>
        <p class="mono control-hint" id="control-hint">Pick two photos: before, then after.</p>
      </section>
    </aside>

  </div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/static/app.js" type="module"></script>
</body>
</html>
