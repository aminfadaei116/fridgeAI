<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123f34" />
    <meta name="description" content="What the fridge camera saw, what is about to expire, and what to cook with it." />
    <title>Savor — your fridge, organized</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#home" data-view="home" aria-label="Savor home">
          <span class="brand-mark">s</span><span>savor</span>
        </a>
        <p class="sidebar-caption">Your kitchen, in sync.</p>
        <nav class="side-nav" aria-label="Main navigation">
          <button class="nav-item is-active" data-view="home"><span>⌂</span> Today</button>
          <button class="nav-item" data-view="inventory"><span>▦</span> Inventory <b id="inventoryCount">0</b></button>
          <button class="nav-item" data-view="recipes"><span>✦</span> Recipes</button>
          <button class="nav-item" data-view="activity"><span>⌁</span> Activity</button>
        </nav>
        <div class="sidebar-bottom">
          <button class="scan-card" data-action="open-upload" id="scanCard">
            <span class="scan-orbit">⌁</span>
            <span><strong>Fresh scan</strong><small>Upload a fridge video</small></span>
            <i>→</i>
          </button>
          <button class="experiment-card" data-view="activity" id="experimentCard">
            <span class="experiment-mark">▦</span>
            <span><strong>No experiment</strong><small>Run backend/pipeline.sh</small></span>
            <i>›</i>
          </button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <button class="mobile-brand" data-view="home" aria-label="Go home"><span class="brand-mark">s</span></button>
          <label class="location"><span class="home-icon">⌂</span><select id="experimentSelect" class="experiment-select" aria-label="Choose experiment"><option value="">No experiments yet</option></select><span class="chevron">⌄</span></label>
          <div class="top-actions">
            <button class="round-button scan-button" data-action="open-upload" aria-label="Upload a video and scan" title="Fresh scan"><span class="scan-glyph">⌁</span><span id="scanDot"></span></button>
            <button class="round-button" data-action="reload" aria-label="Reload experiment data" title="Reload data">↻</button>
            <button class="round-button notification-button" data-action="show-alerts" aria-label="View expiry alerts">♧<span id="notificationDot"></span></button>
          </div>
        </header>
        <div id="app" class="page" aria-live="polite"></div>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="Mobile navigation">
      <button class="mobile-nav-item is-active" data-view="home"><span>⌂</span><small>Today</small></button>
      <button class="mobile-nav-item" data-view="inventory"><span>▦</span><small>Inventory</small></button>
      <button class="mobile-nav-item" data-view="recipes"><span>✦</span><small>Recipes</small></button>
      <button class="mobile-nav-item" data-view="activity"><span>⌁</span><small>Activity</small></button>
    </nav>

    <div id="modalRoot"></div>
    <div id="toast" class="toast" role="status"></div>
    <script src="./app.js"></script>
  </body>
</html>
