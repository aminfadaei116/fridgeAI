<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123f34" />
    <meta name="description" content="A calm, smart way to keep track of what is in your fridge and what to eat next." />
    <title>Savor — your fridge, organized</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#home" data-view="home" aria-label="Savor home">
          <span class="brand-mark">s</span><span>savor</span>
        </a>
        <p class="sidebar-caption">Your kitchen, in sync.</p>
        <nav class="side-nav" aria-label="Main navigation">
          <button class="nav-item is-active" data-view="home"><span>⌂</span> Today</button>
          <button class="nav-item" data-view="inventory"><span>▦</span> Inventory <b id="inventoryCount">0</b></button>
          <button class="nav-item" data-view="plan"><span>✦</span> Meal plan</button>
        </nav>
        <div class="sidebar-bottom">
          <button class="scan-card" data-action="scan">
            <span class="scan-orbit">⌁</span>
            <span><strong>Fresh scan</strong><small>Update your inventory</small></span>
            <i>→</i>
          </button>
          <button class="user-card" data-view="profile"><span class="avatar">AM</span><span><strong>Amir</strong><small>Home kitchen</small></span><i>›</i></button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <button class="mobile-brand" data-view="home" aria-label="Go home"><span class="brand-mark">s</span></button>
          <div class="location"><span class="home-icon">⌂</span><span>Amir's kitchen</span><span class="chevron">⌄</span></div>
          <div class="top-actions">
            <button class="round-button" data-action="scan" aria-label="Scan fridge">⌁</button>
            <button class="round-button notification-button" data-action="show-alerts" aria-label="View notifications">♧<span id="notificationDot"></span></button>
          </div>
        </header>
        <div id="app" class="page" aria-live="polite"></div>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="Mobile navigation">
      <button class="mobile-nav-item is-active" data-view="home"><span>⌂</span><small>Today</small></button>
      <button class="mobile-nav-item" data-view="inventory"><span>▦</span><small>Inventory</small></button>
      <button class="mobile-scan" data-action="scan" aria-label="Scan your fridge"><span>⌁</span></button>
      <button class="mobile-nav-item" data-view="plan"><span>✦</span><small>Plan</small></button>
      <button class="mobile-nav-item" data-view="profile"><span>◌</span><small>Profile</small></button>
    </nav>

    <div id="modalRoot"></div>
    <div id="toast" class="toast" role="status"></div>
    <script src="./app.js"></script>
  </body>
</html>
